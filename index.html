<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IA na agropecuária</title>
<link rel="stylesheet" href="estilo.css">
<script defer src="conteudo.js"></script>
<script defer src="fazenda.js"></script>
<script defer src="voo3d.js"></script>
<script defer src="missao.js"></script>
<script defer src="duelo.js"></script>
<script defer src="audio-voo.js"></script>
<script defer src="voo-livre.js"></script>
<script defer src="videos-narrados.js"></script>
<script defer src="apresentacao.js"></script>
<script defer src="narracao.js"></script>
</head>
<body>
<div class="frame">
<header class="top">
  <button class="brand" data-go="0" aria-label="Voltar à capa"><span class="mark" aria-hidden="true"></span> AGRO<span>IA</span></button>
  <nav aria-label="Blocos do seminário">
    <button data-block="1">Aluno 1</button><button data-block="2">Aluno 2</button><button data-block="3">Aluno 3</button>
  </nav>
  <div class="options">
    <button id="narration-open" aria-controls="narration">🔊 Ouvir apresentação</button>
    <button data-dialog="roteiro" title="Roteiro (R)">Roteiro</button>
    <button data-dialog="fontes" title="Referências">Fontes</button>
    <button data-dialog="midia" title="Fotos e arquivos locais">Mídia</button>
    <button id="fullscreen" title="Tela cheia (F)" aria-label="Tela cheia">⛶</button>
  </div>
</header>
<section id="narration" hidden aria-label="Apresentação narrada">
  <div class="narration-controls">
    <button id="narration-play">Ouvir este slide</button>
    <button id="narration-repeat" aria-label="Repetir slide" title="Repetir slide">↺</button>
    <button id="narration-back" aria-label="Slide anterior" title="Slide anterior">←</button>
    <button id="narration-next" aria-label="Próximo slide" title="Próximo slide">→</button>
    <span id="narration-page" aria-hidden="true"></span>
    <details id="narration-settings">
      <summary>Ajustes</summary>
      <div class="narration-popover">
        <label>Voz <select id="narration-voice"><option value="">Automática (português)</option></select></label>
        <label>Velocidade <select id="narration-speed"><option value="0.65">Bem devagar</option><option value="0.8">Devagar</option><option value="1" selected>Normal</option><option value="1.15">Mais rápido</option></select></label>
        <label><input id="narration-auto" type="checkbox" checked> Avançar automaticamente</label>
        <details id="narration-transcript"><summary>Transcrição deste slide</summary><p id="narration-text"></p></details>
      </div>
    </details>
    <button id="narration-fullscreen" aria-label="Alternar tela cheia" title="Alternar tela cheia">⛶</button>
    <button id="narration-close" aria-label="Fechar narração" title="Fechar narração">✕</button>
  </div>
  <p id="narration-status" class="narration-sr" role="status"></p>
</section>
<button id="fullscreen-narration-open" hidden>🔊 Ouvir apresentação</button>
<main id="slide" aria-label="Slide atual"></main>
<footer class="bottom">
  <div id="credit" class="credit"></div>
  <div class="page-nav">
    <button id="prev" aria-label="Slide anterior">←</button>
    <span id="page" aria-live="polite"></span>
    <button id="next" aria-label="Próximo slide">→</button>
  </div>
</footer>
<div class="track" aria-hidden="true"><div id="progress"></div></div>
</div>
<dialog id="dialog"><div class="dialog-head"><h2 id="dialog-title"></h2><form method="dialog"><button aria-label="Fechar">✕</button></form></div><div id="dialog-body"></div></dialog>
<dialog id="narrated-clip" aria-labelledby="narrated-clip-title">
  <h2 id="narrated-clip-title"></h2>
  <div id="narrated-clip-player"></div>
  <p id="narrated-clip-status" role="status"></p>
  <div class="narrated-clip-actions">
    <button id="narrated-clip-play" hidden>Reproduzir vídeo</button>
    <button id="narrated-clip-continue">Continuar apresentação / pular vídeo</button>
    <input id="narrated-clip-file" type="file" accept="video/mp4,.mp4" aria-label="Selecionar MP4 baixado" hidden>
    <button id="narrated-clip-fullscreen">Tela cheia do navegador</button>
    <a id="narrated-clip-source" target="_blank" rel="noopener noreferrer">Abrir vídeo original</a>
  </div>
</dialog>
<noscript>Ative o JavaScript para abrir a apresentação.</noscript>
</body>
</html>
